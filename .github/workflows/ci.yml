name: CI

on:
  push:
    branches:
      - master
      - 'modernize/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Reject legacy build syntax
        run: npm run check:legacy

      - name: Test
        run: npm test

      - name: TypeScript parse gate
        run: npm run typecheck

      - name: Build browser client
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/wowser-vite-build.log
          if grep -E 'externalized for browser compatibility|didn.t resolve at build time' /tmp/wowser-vite-build.log; then
            echo 'Vite build still depends on unresolved browser compatibility fallbacks.' >&2
            exit 1
          fi
          test -f dist/index.html
          test -f dist/favicon.png
