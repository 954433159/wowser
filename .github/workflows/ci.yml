name: Phase 1 bootstrap

on:
  push:
    branches:
      - modernize/phase-1-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task-3:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and refresh lockfile when dependencies changed
        run: |
          if [ "${GITHUB_ACTOR}" = "github-actions[bot]" ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify compatibility dependencies
        run: npm ls blizzardry @napi-ffi/ffi-napi @napi-ffi/ref-napi events buffer stream-browserify util string_decoder --all

      - name: Reject legacy build syntax
        run: npm run check:legacy

      - name: Run characterization tests
        run: npm test

      - name: TypeScript parse gate
        run: npm run typecheck

      - name: Build browser client without unresolved compatibility warnings
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/wowser-vite-build.log
          if grep -E 'externalized for browser compatibility|didn.t resolve at build time' /tmp/wowser-vite-build.log; then
            echo 'Vite build still depends on unresolved browser compatibility fallbacks.' >&2
            exit 1
          fi

      - name: Inspect build output
        run: |
          test -f dist/index.html
          test -f dist/favicon.png
          find dist -maxdepth 2 -type f -print | sort

      - name: Verify Vite development shell
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/wowser-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /tmp/wowser-index.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          curl --fail --silent --head http://127.0.0.1:5173/favicon.png > /dev/null
          grep -q '<app></app>' /tmp/wowser-index.html
          cat /tmp/wowser-vite.log

      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add browser compatibility polyfills"
          git push origin HEAD:${GITHUB_REF_NAME}
