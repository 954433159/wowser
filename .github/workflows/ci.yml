name: CI

on:
  push:
    branches:
      - master
      - 'modernize/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify Node 24 FFI bindings
        run: |
          node - <<'NODE'
          const { createRequire } = require('node:module');
          const requireFromBlizzardry = createRequire(require.resolve('blizzardry/package.json'));
          const ffi = requireFromBlizzardry('ffi-napi');
          const ref = requireFromBlizzardry('ref-napi');
          if (typeof ffi.Library !== 'function') throw new Error('ffi-napi Library API unavailable');
          if (!ref.types || !ref.types.void) throw new Error('ref-napi types API unavailable');
          console.log('Node 24 FFI bindings loaded');
          NODE

      - name: Reject legacy build syntax
        run: npm run check:legacy

      - name: Test
        run: npm test

      - name: TypeScript parse gate
        run: npm run typecheck

      - name: Build browser client
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/wowser-vite-build.log
          if grep -E 'externalized for browser compatibility|didn.t resolve at build time' /tmp/wowser-vite-build.log; then
            echo 'Vite build still depends on unresolved browser compatibility fallbacks.' >&2
            exit 1
          fi
          test -f dist/index.html
          test -f dist/favicon.png
