name: Phase 1 bootstrap

on:
  push:
    branches:
      - modernize/phase-1-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  task-1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Resolve dependency graph and regenerate lockfile
        run: npm install

      - name: Verify dependency aliases
        run: npm ls blizzardry @napi-ffi/ffi-napi @napi-ffi/ref-napi @napi-ffi/ref-array-di @napi-ffi/ref-struct-di --all

      - name: Reject legacy Babel syntax
        run: npm run check:legacy

      - name: Run characterization tests
        run: npm test

      - name: Verify clean install from regenerated lockfile
        run: |
          rm -rf node_modules
          npm ci
          npm test

      - name: Commit regenerated lockfile
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: regenerate node 24 lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
