name: Phase 1 bootstrap

on:
  push:
    branches:
      - modernize/phase-1-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-3:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify dependency aliases
        run: npm ls blizzardry @napi-ffi/ffi-napi @napi-ffi/ref-napi @napi-ffi/ref-array-di @napi-ffi/ref-struct-di --all

      - name: Inspect Blizzardry published files
        run: |
          find node_modules/blizzardry -maxdepth 4 -type f -print | sort
          node - <<'NODE'
          const candidates = [
            'blizzardry/lib/adt',
            'blizzardry/lib/adt/index.js',
            'blizzardry/lib/dbc/entities',
            'blizzardry/lib/m2',
            'blizzardry/lib/wdt',
            'blizzardry/lib/wmo',
            'blizzardry/lib/wmo/group',
            'blizzardry/lib/restructure'
          ];
          for (const candidate of candidates) {
            try {
              console.log(candidate, '=>', require.resolve(candidate));
            } catch (error) {
              console.log(candidate, '=> UNRESOLVED:', error.code, error.message);
            }
          }
          NODE

      - name: Reject legacy build syntax
        run: npm run check:legacy

      - name: Run characterization tests
        run: npm test

      - name: TypeScript parse gate
        run: npm run typecheck

      - name: Build browser client
        run: npm run build

      - name: Inspect build output
        run: |
          test -f dist/index.html
          test -f dist/favicon.png
          find dist -maxdepth 2 -type f -print | sort

      - name: Verify Vite development shell
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/wowser-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /tmp/wowser-index.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          curl --fail --silent --head http://127.0.0.1:5173/favicon.png > /dev/null
          grep -q '<app></app>' /tmp/wowser-index.html
          cat /tmp/wowser-vite.log
